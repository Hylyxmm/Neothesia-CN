name: Publish

on:
  push:
    tags:
      - "v*"

# New repositories default the workflow token to read-only, which made the release
# create/upload steps fail with "release not found" / 403.
permissions:
  contents: write

jobs:
  # `gh release upload` fails when the release doesn't exist yet, so make sure it does before
  # any build job uploads to it. Re-running an existing release is fine (the create no-ops).
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{github.ref_name}} --title "Neothesia ${{github.ref_name}}" --generate-notes -R ${{github.repository}} || true

  build_ubuntu:
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/ubuntu
      - name: ls
        run: ls -l app.zip
      - name: Rename
        run: mv app.zip neothesia-ubuntu.zip
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{github.ref_name}} neothesia-ubuntu.zip

  build_ubuntu_recorder:
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/ubuntu-recorder
      - name: ls
        run: ls -l app.zip
      - name: Rename
        run: mv app.zip neothesia-cli-ubuntu.zip
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_FLAGS: --features build-ffmpeg
        run: gh release upload ${{github.ref_name}} neothesia-cli-ubuntu.zip

  build_windows:
    needs: create_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/windows
      - name: ls
        run: ls -l target/release/neothesia.exe
      - name: Rename
        run: Move-Item -Path target/release/neothesia.exe -Destination neothesia.exe
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{github.ref_name}} neothesia.exe

  build_windows_recorder:
    needs: create_release
    runs-on: windows-latest

    env:
      FFMPEG_DOWNLOAD_URL: https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-full_build-shared.7z
      
    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/windows-recorder
      - name: ls
        run: ls -l target/release/neothesia-cli.exe
      - name: Rename
        run: Move-Item -Path target/release/neothesia-cli.exe -Destination neothesia-cli.exe
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{github.ref_name}} neothesia-cli.exe

  build_macos:
    needs: create_release
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: 10.12

    steps:
      - uses: actions/checkout@v6
      - id: Build
        uses: ./.github/actions/macos
      - name: ls
        run: ls -l .github/app/app.zip
      - name: Rename
        run: mv .github/app/app.zip neothesia-macos.zip
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{github.ref_name}} neothesia-macos.zip

